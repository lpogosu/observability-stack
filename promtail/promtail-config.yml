server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Services that emit one JSON object per line. Their fields become a level
  # label plus structured metadata.
  - job_name: json-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["observability.logs=json"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            level: level
            ts: ts
            trace_id: trace_id
            span_id: span_id
            http_route: http_route
            http_status: http_status
      - timestamp:
          source: ts
          format: RFC3339
      # `level` is a label because it has five possible values and every query
      # filters on it.
      - labels:
          level:
      # `trace_id` is structured metadata, never a label: one stream per trace
      # would turn a day of traffic into millions of streams and take Loki with
      # it. Structured metadata is indexed per line, not per stream.
      - structured_metadata:
          trace_id:
          span_id:
      - labeldrop:
          - filename

  # Everything else in the stack. No parsing - these are third-party formats and
  # inventing labels for them would only create streams nobody queries.
  - job_name: stack-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["observability.logs=raw"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
    pipeline_stages:
      - labeldrop:
          - filename
