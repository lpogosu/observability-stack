name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The same pinned images the Makefile uses: the tool that validates the rules
  # has to be the version that will evaluate them.
  PROM_IMAGE: prom/prometheus:v3.4.1
  AM_IMAGE: prom/alertmanager:v0.28.1

jobs:
  rules:
    name: prometheus rules and alertmanager config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - name: promtool check config
        run: |
          docker run --rm -v "$PWD":/w -w /w --entrypoint promtool "$PROM_IMAGE" \
            check config prometheus/prometheus.yml

      - name: promtool check rules
        run: |
          docker run --rm -v "$PWD":/w -w /w --entrypoint promtool "$PROM_IMAGE" \
            check rules prometheus/rules/recording.yml prometheus/rules/alerting.yml

      # The part that actually proves something: each alert is driven into and
      # out of the firing state against synthetic series.
      - name: promtool test rules
        run: |
          docker run --rm -v "$PWD":/w -w /w --entrypoint promtool "$PROM_IMAGE" \
            test rules prometheus/rules/tests/availability_test.yml \
                       prometheus/rules/tests/latency_test.yml \
                       prometheus/rules/tests/infrastructure_test.yml \
                       prometheus/rules/tests/traffic_test.yml \
                       prometheus/rules/tests/recording_test.yml

      - name: amtool check-config
        run: |
          docker run --rm -v "$PWD":/w -w /w --entrypoint amtool "$AM_IMAGE" \
            check-config alertmanager/alertmanager.yml

      - name: grafana dashboards are valid JSON
        run: |
          for file in grafana/dashboards/*.json; do
            python3 -m json.tool "$file" > /dev/null
            echo "valid JSON: $file"
          done

  python:
    name: lint, types and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            sample-app/requirements.txt

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: yamllint
        run: yamllint -c .yamllint.yml .

      - name: ruff
        run: ruff check .

      - name: mypy --strict
        run: mypy sample-app/app loadgen/loadgen alert-sink/alert_sink

      - name: pytest
        run: pytest

  compose:
    name: docker compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - name: validate the compose file
        run: docker compose config --quiet

      - name: build the images the stack owns
        run: docker compose --profile load build
