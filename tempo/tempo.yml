# Tempo receives OTLP over HTTP and gRPC and writes blocks to local disk.
#
# The metrics_generator is deliberately not enabled. It would produce a second
# set of RED metrics derived from spans, and those spans are sampled - an SLO
# computed from sampled data is an estimate presented as a measurement. The
# application's own Prometheus metrics cover every request, so they stay the
# single source of truth for the alerts.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
